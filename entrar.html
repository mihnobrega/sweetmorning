<body>
    <header>
        <div class="container header-container">
            <a href="#" class="logo">
                <i class="fa-solid fa-mug-hot logo-icon"></i>
                <div class="logo-text">Sweet <span>Morning</span></div>
            </a>

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="cardapio.html">Cardápio</a></li>
                     <li><a href="localizacao.html">Localização</a></li>
                    <li><a href="sobrenos.html">Sobre Nós</a></li>
                   
                </ul>
            </nav>

            <div class="nav-buttons">
                <a href="entrar.html" class="btn btn-secundary">Sign In</a>
            </div>
        </div>
    </header>

    <section class="login-section">
        <div class="login-box">
            <div class="top">
                <div class="account-type">
                    <button class="type-btn active" onclick="selectType(this)">
                        <i class="fa-solid fa-user"></i>
                        Cliente
                    </button>

                    <button class="type-btn" onclick="selectType(this)">
                        <i class="fa-solid fa-user-tie"></i>
                        Funcionário
                    </button>
                </div>

                <span>
                    Não possui conta?
                    <a href="cadastro.html">Criar Conta</a>
                </span>

                <h4>Login</h4>
                <p>
                    Entre na sua conta Sweet Morning.
                </p>
            </div>

            <form action="login.php" method="POST">
                <div class="input-box">
                    <input
                        type="email"
                        name="email"
                        class="input-field"
                        placeholder="email"
                        required
                    >
                    <i class="fa-solid fa-envelope"></i>
                </div>

                <div class="input-box">
                    <input
                        type="password"
                        name="senha"
                        class="input-field"
                        placeholder="senha"
                        required
                    >
                    <i class="fa-solid fa-lock"></i>
                </div>
                <input
                type="hidden"
                value="cliente"
                id="tipo"
                name="tipo"
                >

              <button type="submit" id="btnEntrar" class="submit-btn">Entrar</button>
            </form>
        </div>
    </section>

     <script>
    function selectType(button) {
        const inputTipo = document.querySelector('#tipo');
        // Redireciona conforme o tipo
        inputTipo.value = button.textContent.includes('Funcionário') ?"funcionario":"cliente";
       

        // Seleciona todos os botões
        const buttons = document.querySelectorAll('.type-btn');

        // Remove a classe "active" de todos
        buttons.forEach(btn => {
            btn.classList.remove('active');
        });

        // Adiciona a classe "active" no botão clicado
        button.classList.add('active');
    }

</script>
</body>
